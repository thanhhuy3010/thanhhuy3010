<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="800" height="400" viewBox="0 0 800 400" fontsize="15px">
<style>
@font-face {
    src: local('Consolas'), local('Consolas Bold');
    font-family: 'ConsolasFallback';
    font-display: swap;
}
.key      { fill: #5EEAD4; font-weight: bold; }   
.string   { fill: #E5E7EB; }   
.number   { fill: #A78BFA; }
.bracket  { fill: #FBBF24; }
.keyword  { fill: #F472B6; }
.comment  { fill: #6B7280; font-style: italic; }
text, tspan {white-space: pre;}
</style>

<defs>
    <clipPath id="circleView">
        <circle cx="120" cy="190" r="90" fill="#FFFFFF" />
    </clipPath>
</defs>

<rect width="800px" height="400px" fill="#0D1117" rx="15"/>

<circle cx="25" cy="25" r="6" fill="#FF5F56"/>
<circle cx="45" cy="25" r="6" fill="#FFBD2E"/>
<circle cx="65" cy="25" r="6" fill="#27C93F"/>
<text x="350" y="30" fill="#8B949E" font-size="14px">thanhhuy3010 ~ bash</text>

<image x="30" y="70" width="180" height="240" preserveAspectRatio="xMidYMid slice" clip-path="url(#circleView)" href="data:image/jpeg;base64," />

<text x="250" y="80" class="comment">
<tspan x="250" dy="1.2em"># Loading profile: thanhhuy3010...</tspan>
<tspan x="250" dy="1.2em"># Fetched from GitHub API dynamically via Actions</tspan>
</text>

<text x="250" y="125">
<tspan x="250" dy="1.2em" class="keyword">const </tspan><tspan class="key">profile</tspan><tspan class="bracket"> = {</tspan>
<tspan x="270" dy="1.5em" class="key">"name"</tspan><tspan class="string">: "Hubert Tran",</tspan>
<tspan x="270" dy="1.5em" class="key">"role"</tspan><tspan class="string">: "Software Engineer",</tspan>
<tspan x="270" dy="1.5em" class="key">"followers"</tspan><tspan class="string">: </tspan><tspan class="number">0</tspan><tspan class="string">,</tspan>
<tspan x="270" dy="1.5em" class="key">"following"</tspan><tspan class="string">: </tspan><tspan class="number">1</tspan><tspan class="string">,</tspan>
<tspan x="270" dy="1.5em" class="key">"repos"</tspan><tspan class="string">: </tspan><tspan class="number">1</tspan><tspan class="string">,</tspan>
<tspan x="270" dy="1.5em" class="key">"skills"</tspan><tspan class="string">: ["Python", "JavaScript", "React", "Node.js", "Docker", "AWS"],</tspan>
<tspan x="250" dy="1.5em" class="bracket">};</tspan>
</text>

<text x="250" y="270" class="comment">
<tspan x="250" dy="1.2em">> console.log("Welcome to my GitHub!");</tspan>
</text>
<text x="250" y="290" class="string">
<tspan x="250" dy="1.2em">Welcome to my GitHub!</tspan>
</text>
<text x="250" y="330" class="keyword">
<tspan x="250" dy="1.2em">█</tspan>
</text>
</svg>
