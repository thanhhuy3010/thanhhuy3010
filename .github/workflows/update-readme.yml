name: Build Profile SVG

on:
  schedule:
    # Chạy mỗi ngày vào lúc 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Cho phép bấm nút chạy bằng tay trên GitHub
  push:
    branches:
      - main
    paths:
      - action_profile_builder.py

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run script to generate SVG
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python action_profile_builder.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dark_dynamic.svg
          # Chỉ commit nếu có sự thay đổi
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update profile SVG"
          git push
